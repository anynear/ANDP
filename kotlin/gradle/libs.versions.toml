# Versions follow the App (gradle/libs.versions.toml) so that the app can use this module without conflicts.
[versions]
kotlin             = "2.4.10"
agp                = "9.4.1"
androidMinSdk      = "26"
androidCompileSdk  = "37"
coroutines         = "1.11.0"
ktor               = "3.5.2"
serialization      = "1.11.0"
cryptography       = "0.6.0"
bouncycastle       = "1.85"

[libraries]
coroutines-core               = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test               = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
ktor-client-core              = { module = "io.ktor:ktor-client-core",              version.ref = "ktor" }
ktor-client-okhttp            = { module = "io.ktor:ktor-client-okhttp",            version.ref = "ktor" }
ktor-client-darwin            = { module = "io.ktor:ktor-client-darwin",            version.ref = "ktor" }
ktor-client-js                = { module = "io.ktor:ktor-client-js",                version.ref = "ktor" }
ktor-client-mock              = { module = "io.ktor:ktor-client-mock",              version.ref = "ktor" }
serialization-json            = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
serialization-cbor            = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "serialization" }
cryptography-core             = { module = "dev.whyoleg.cryptography:cryptography-core",             version.ref = "cryptography" }
cryptography-provider-jdk     = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk",     version.ref = "cryptography" }
cryptography-provider-optimal = { module = "dev.whyoleg.cryptography:cryptography-provider-optimal", version.ref = "cryptography" }
bouncycastle                  = { module = "org.bouncycastle:bcprov-jdk18on",       version.ref = "bouncycastle" }

[plugins]
kotlinMultiplatform               = { id = "org.jetbrains.kotlin.multiplatform",       version.ref = "kotlin" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinSerialization               = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
